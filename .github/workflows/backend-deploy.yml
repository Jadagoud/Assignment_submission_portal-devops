name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'database/**'
      - 'alembic.ini'
      - 'entrypoint.sh'
      - 'seed.py'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: assignment-backend
  ECS_CLUSTER: assignment-portal-cluster
  ECS_SERVICE: assignment-backend-service

jobs:
  deploy:
    runs-on: ubuntu-latest

      - name: Debug GitHub OIDC
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::451782721795:role/GitHubActionsAssignmentRole
          aws-region: ${{ env.AWS_REGION }}
